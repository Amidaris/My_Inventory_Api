version: "3.9"

services:
  db:
    image: postgres:15
    container_name: my_invoice_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invoice_database
    ports:
      - "5434:5432"
    volumes:
      - my_invoice_data:/var/lib/postgresql/data

volumes:
  my_invoice_data:
